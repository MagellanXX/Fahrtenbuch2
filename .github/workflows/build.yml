name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev ccache

      - name: Install Build Tools (Pinned Stable p4a)
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install "cython<3.0" "buildozer==1.5.0" "python-for-android==2024.1.21"

      - name: Build APK with Buildozer
        run: |
          python3 -m buildozer -v android debug

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fahrtenbuch-apk
          path: bin/*.apk